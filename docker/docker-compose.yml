# Containerized deployment of the jina-reranker-api service.
# Copy .env.example to .env first, then run from the repo root:
#   docker compose -f docker/docker-compose.yml up -d
services:
  jina-reranker-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/fidonis/jina-reranker-api:latest
    container_name: jina-reranker-api
    env_file:
      - path: .env
        required: false
    ports:
      # Both sides read PORT from .env so a single variable change is enough.
      - "${PORT:-8000}:${PORT:-8000}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,os,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:'+os.environ.get('PORT','8000')+'/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
